name: graphrag-gateway
# version: '3.8'

# ========================================
# 共通インフラストラクチャ層 (Firecrawl 究極安定版)
# ========================================

services:
  # ========================================
  # Redis / Neo4j / FalkorDB / Kuzu / TiDB / Qdrant
  # （これらは変更なし）
  # ========================================
  redis:
    image: redis:latest
    container_name: graphrag-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode yes
      --requirepass "${REDIS_PASSWORD:-RedisPass@0302}"
      --maxmemory 768mb
      --maxmemory-policy volatile-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-RedisPass@0302}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-RedisPass@0302}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisPass@0302}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - graphrag_shared_network

  neo4j:
    image: neo4j:latest
    container_name: graphrag-neo4j
    hostname: graphrag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-p@ssw0rd}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # 🔥 [追加] Neo4jの内部メモリ設定 (ヒープ:8GB, ページキャッシュ:12GB)
      - NEO4J_dbms_memory_heap_initial__size=8G
      - NEO4J_dbms_memory_heap_max__size=8G
      - NEO4J_dbms_memory_pagecache_size=12G
    volumes:
      # ▼ 【ローカル保存】現在のWindows側の ./data フォルダに直接保存する設定
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs

      # ▼ 【NAS保存用】NASをネットワークドライブ（例: Z:）として割り当てている場合
      # - Z:/Ariadne_Backup/neo4j/data:/data
      # - Z:/Ariadne_Backup/neo4j/logs:/logs

      # ▼ 【NAS保存用】NASのIPアドレスを直接指定する場合
      # - //192.168.x.x/shared_folder/neo4j/data:/data
      # - //192.168.x.x/shared_folder/neo4j/logs:/logs

    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1" ]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 24G  # 🌟 16G -> 24Gに拡張
    restart: unless-stopped
    networks:
      - graphrag_shared_network

