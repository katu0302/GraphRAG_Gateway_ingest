#version: '3.8'

services:
  # ========================================
  # Neo4j（profile: neo4j）
  # ========================================
  neo4j:
    image: neo4j:latest
    container_name: graphrag-neo4j
    profiles:
      - neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-p@ssw0rd}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    networks:
      - graphrag_shared_network

  # ========================================
  # FalkorDB（profile: falkordb）
  # ========================================
  falkordb:
    image: falkordb/falkordb:latest
    container_name: graphrag-falkordb
    profiles:
      - falkordb
    ports:
      - "16380:6379"
      - "3000:3000"
    environment:
      - FALKORDB_ARGS=THREAD_COUNT 4
    volumes:
      - falkordb-data:/data
      - falkordb-logs:/logs
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    networks:
      - graphrag_shared_network

  # ========================================
  # Kuzu（profile: kuzu）
  # ========================================
  kuzu:
    image: kuzudb/api-server:latest
    container_name: graphrag-kuzu
    profiles:
      - kuzu
    ports:
      - "8005:8000"
    environment:
      - MODE=READ_WRITE
      - KUZU_BUFFER_POOL_SIZE=1073741824
      - CROSS_ORIGIN=true
      - KUZU_LOG_LEVEL=INFO
    volumes:
      - kuzu-data:/data
      - kuzu-logs:/logs
      - kuzu-database:/database:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    networks:
      - graphrag_shared_network

  # ========================================
  # TiDB（profile: tidb）
  # ========================================
  tidb:
    build:
      context: .
      dockerfile: Dockerfile.tidb
      args:
        - TIDB_VERSION=${TIDB_VERSION:-v8.5.4}
    container_name: graphrag-tidb
    profiles:
      - tidb
    command: >
      /bin/bash -c "
      echo 'Starting TiDB Playground ${TIDB_VERSION:-v8.5.4}...' &&
      exec /root/.tiup/bin/tiup playground ${TIDB_VERSION:-v8.5.4}
        --host 0.0.0.0
        --tag devenv
        --db 1
        --kv 1
        --pd 1
        --tiflash 0
        --without-monitor=false
        --monitor.host 0.0.0.0
      "
    ports:
      - "4000:4000"   # MySQL protocol
      - "10080:10080" # HTTP status API
      - "2379:2379"   # PD/dashboard
      - "3001:3000"   # Grafana
      - "9090:9090"   # Prometheus
    volumes:
      - tidb-data:/data
      - tidb-logs:/root/.tiup/data
    environment:
      - TIDB_VERSION=${TIDB_VERSION:-v8.5.4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10080/status"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    networks:
      - graphrag_shared_network

  # ========================================
  # アプリケーションサービス（全ストレージ共通）
  # ========================================
  graphrag-ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=${BUILD_ENV:-production}
    # command: python -u GraphRAG6_Store_ingest.py
    command: python -u GraphRAG7_Store_ingest.py
    container_name: graphrag-ingest
    hostname: graphrag-ingest
    restart: on-failure:3
    env_file:
      - .env
    environment:
      # Graph Store Type（動的切り替え）
      - GRAPH_STORE_TYPE=${GRAPH_STORE_TYPE:-neo4j}

      # Neo4j設定
      - NEO4J_URL=${NEO4J_URL:-bolt://graphrag-neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-p@ssw0rd}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}

      # FalkorDB設定
      - FALKORDB_URL=${FALKORDB_URL:-redis://graphrag-falkordb:6379}
      - FALKORDB_GRAPH_NAME=${FALKORDB_GRAPH_NAME:-knowledge_graph}

      # Kuzu設定
      - KUZU_DB_PATH=${KUZU_DB_PATH:-/app/storage_kg/kuzu_db}

      # TiDB設定
      - TIDB_HOST=${TIDB_HOST:-graphrag-tidb}
      - TIDB_PORT=${TIDB_PORT:-4000}
      - TIDB_USER=${TIDB_USER:-root}
      - TIDB_PASSWORD=${TIDB_PASSWORD:-}
      - TIDB_DATABASE=${TIDB_DATABASE:-graphrag}
      - TIDB_TABLE_NAME=${TIDB_TABLE_NAME:-knowledge_graph}

      # 共通設定
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
      - PIP_NO_CACHE_DIR=1
      - KNOWLEDGE_GRAPH=${KNOWLEDGE_GRAPH:-default}
      - QUERY_TIMEOUT=160
      - AUTO_PROCESS=true
      - DEBUG_MODE=false
      - PROGRESS_UPDATE=true
      - ENABLE_FICTIONAL_DETECTION=false
      - TZ=Asia/Tokyo
      - CSV_OUTPUT_DIR=/app/output
      - SHOW_PROMPT=false
      - LOG_LEVEL=WARNING
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - storage_kg_shared:/app/storage_kg
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
    networks:
      - graphrag_shared_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"

# ========================================
# ボリューム定義
# ========================================
volumes:
  # 共通ボリューム
  storage_kg_shared:
    external: true
    name: graphrag_storage_kg

  # Neo4j用
  neo4j-data:
    name: graphrag_neo4j_ingest_data
  neo4j-logs:
    name: graphrag_neo4j_ingest_logs

  # FalkorDB用
  falkordb-data:
    name: graphrag_falkordb_ingest_data
  falkordb-logs:
    name: graphrag_falkordb_ingest_logs

  # Kuzu用
  kuzu-data:
    name: graphrag_kuzu_ingest_data
  kuzu-logs:
    name: graphrag_kuzu_ingest_logs
  kuzu-database:
    name: graphrag_kuzu_ingest_database

  # TiDB用
  tidb-data:
    name: graphrag_tidb_ingest_data
  tidb-logs:
    name: graphrag_tidb_ingest_logs

# ========================================
# ネットワーク定義
# ========================================
networks:
  graphrag_shared_network:
    external: true
    name: graphrag_shared_network
